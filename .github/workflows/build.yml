name: Build Creative Squad 4 Relics

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Configurar Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Extrair projeto V11
        run: |
          unzip -o creative_squad_etapa1_corrigido_v11.zip
          ls -la
          ls -la creative_squad

      - name: Compilar mod
        working-directory: creative_squad
        run: |
          gradle build --no-daemon

      - name: Pegar JAR
        uses: actions/upload-artifact@v4
        with:
          name: creative-squad-4-relics
          path: creative_squad/build/libs/creative-squad-4-relics-0.1.0.jar
          if-no-files-found: error
